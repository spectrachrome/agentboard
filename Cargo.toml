[package]
name = "agentboard"
version = "0.1.0"
edition = "2024"
description = "A virtual workspace for your agents."
license = "MIT"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
tower-http = { version = "0.7.1", features = ["fs"] }
